# Pinned so the existing container and volume survive the checkout folder being renamed.
name: order-of-saint-michael
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: osm
      POSTGRES_PASSWORD: osm
      POSTGRES_DB: osm
    ports:
      - "5434:5432"
    volumes:
      - osm-pg:/var/lib/postgresql/data

volumes:
  osm-pg:
