name: E2E

# Playwright end-to-end suite against a throwaway Postgres, kept out of ci.yml so the CI badge reflects the fast checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: guildbook
          POSTGRES_PASSWORD: guildbook
          POSTGRES_DB: guildbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guildbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Placeholders only. Playwright's config turns on AUTH_TEST_MODE and BATTLENET_MOCK for the dev server it starts.
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgres://guildbook:guildbook@localhost:5432/guildbook
      AUTH_SECRET: ci-placeholder-auth-secret-not-used-anywhere
      AUTH_DISCORD_ID: ci-placeholder
      AUTH_DISCORD_SECRET: ci-placeholder
      DEFAULT_GUILD_SLUG: osm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Global setup reseeds the demo guild before the run.
      - name: Playwright
        run: pnpm test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
